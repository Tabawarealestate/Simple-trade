openapi: 3.1.0
info:
  title: Asterion Markets API
  version: 1.0.0-draft
  description: |
    Draft server-authoritative contract. This API does not expose fabricated financial values.
    Quotes, balances, order outcomes, and settlements require traceable server records.
servers:
  - url: https://api.example.invalid
paths:
  /live:
    get:
      summary: Process liveness check
      responses:
        '200': { description: Process is running }
  /ready:
    get:
      summary: Dependency readiness check
      responses:
        '200': { description: Required dependencies ready }
        '503': { description: Dependency unavailable }
  /api/v1/quotes/{instrumentId}:
    get:
      summary: Get a provider-sourced quote or explicit unavailable status
      parameters:
        - $ref: '#/components/parameters/InstrumentId'
      responses:
        '200':
          description: Quote response; no price fields are present unless source status is AVAILABLE.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuoteResponse' }
        '404': { $ref: '#/components/responses/Problem' }
  /api/v1/orders:
    post:
      summary: Create a server-authoritative order request
      description: Client values are never authoritative for price, fees, acceptance, execution, or settlement.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateOrderRequest' }
      responses:
        '201':
          description: Command accepted and server order record created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
components:
  parameters:
    InstrumentId:
      in: path
      name: instrumentId
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      schema: { type: string, minLength: 16, maxLength: 255 }
    RequestId:
      in: header
      name: X-Request-Id
      required: false
      schema: { type: string, format: uuid }
  responses:
    Problem:
      description: RFC 9457-style structured error
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    QuoteResponse:
      type: object
      required: [instrumentId, status, asOf]
      properties:
        instrumentId: { type: string, format: uuid }
        status: { type: string, enum: [AVAILABLE, STALE, UNAVAILABLE, HALTED] }
        asOf: { type: string, format: date-time }
        source: { type: string }
        bid: { type: [number, 'null'] }
        ask: { type: [number, 'null'] }
        last: { type: [number, 'null'] }
    CreateOrderRequest:
      type: object
      required: [instrumentId, productType, direction, notionalMinor, currency]
      properties:
        instrumentId: { type: string, format: uuid }
        productType: { type: string, enum: [MARKET, LIMIT, STOP, HIGHER, LOWER, ABOVE, BELOW, TOUCH, NO_TOUCH, RANGE] }
        direction: { type: string, enum: [BUY, SELL] }
        notionalMinor: { type: integer, minimum: 1 }
        currency: { type: string, enum: [NGN, USD, EUR, GBP] }
        clientReference: { type: string, maxLength: 128 }
    Order:
      type: object
      required: [id, status, instrumentId, productType, direction, notionalMinor, currency, createdAt]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [PENDING, OPEN, PARTIALLY_FILLED, FILLED, CANCELLED, EXPIRED, SETTLED, REJECTED] }
        instrumentId: { type: string, format: uuid }
        productType: { type: string }
        direction: { type: string }
        notionalMinor: { type: integer }
        currency: { type: string }
        createdAt: { type: string, format: date-time }
    Problem:
      type: object
      required: [type, title, status, requestId]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        requestId: { type: string, format: uuid }
